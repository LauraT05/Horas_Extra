spring.application.name=horas-extra-api

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:horasextra;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Esquema + datos de prueba (la BD en memoria se recrea en cada arranque)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Mail (dev: apunta a un SMTP local tipo MailHog; si no hay nada escuchando, el job
# solo registrara el error en logs y reintentara en la siguiente corrida/disparo manual)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
horasextra.mail.from=no-reply@horasextra.local

# Job semanal (lunes 7:00 am por defecto, configurable sin recompilar)
horasextra.scheduler.weekly-cron=0 0 7 * * MON
